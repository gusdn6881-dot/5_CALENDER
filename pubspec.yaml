name: calender_app
description: "Cross-platform Calendar and To-Do App with iOS & Android Home Widgets"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Backend & State
  supabase_flutter: ^2.5.0
  provider: ^6.1.2

  # Calendar & Date/Time
  table_calendar: ^3.1.2
  intl: ^0.19.0
  uuid: ^4.4.0

  # Home Screen Widget Integration
  home_widget: ^0.6.0

  # Local Notifications
  flutter_local_notifications: ^17.2.1

  # Local Cache / Storage
  shared_preferences: ^2.2.3

  # UI & Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

